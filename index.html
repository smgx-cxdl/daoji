<style>
  :root { --ink:#222; --grid:#dcdcdc; --muted:#888; --red:#e02020; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f4f4f2; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
    padding-bottom: 25vh;
  }

  /* 左右滑动翻页 */
  #pager {
    display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
  }
  #pager::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; }

  /* 底部页码 */
  #pgbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; height: 42px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: #fff; border-top: 1px solid var(--grid); font-size: 14px; color: #444;
  }
  #pgbar.hide { display: none; }
  #pgbar button {
    font: inherit; font-size: 20px; line-height: 1; width: 44px; height: 34px; padding: 0;
    border: none; background: transparent; color: var(--ink); cursor: pointer;
  }
  #pgbar button:disabled { color: #ccc; cursor: default; }
  #pgtxt { min-width: 118px; text-align: center; }
</style>
<style>
/* ===== 第 1 页：倒数日 ===== */
body.dragging,
body.dragging * { user-select: none; -webkit-user-select: none; }
#pA .sheet { max-width: 560px; margin: 16px auto; padding: 16px 12px 24px;
    background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
#pA .today { font-size: 20px; font-weight: bold; margin: 4px 0 16px; }
#pA .calc { display: grid; grid-template-columns: 1fr 64px 1fr; gap: 8px; margin-bottom: 22px; }
#pA .calc .lab { font-size: 13px; color: #444; margin-bottom: 4px; white-space: nowrap; }
#pA .calc input,
#pA .calc .res { width: 100%; height: 36px; border: 1px solid var(--grid); background: #fff;
    font: inherit; font-size: 13px; color: var(--ink); padding: 0 6px; border-radius: 0; outline: none;
    display: flex; align-items: center; }
#pA .calc input { text-align: right; }
#pA .calc .res { justify-content: flex-end; }
#pA .calc input:focus { background: #fff8e6; }
#pA .row { display: grid; grid-template-columns: 24px minmax(0, 1fr);
    -webkit-touch-callout: none; }
#pA .body { display: grid; font-size: 10.5px;
    grid-template-columns: minmax(0, 1fr) calc(8ch + 3em + 14px) calc(8ch + 3em + 14px) 3.9em 3.9em; }
#pA .body > * { min-height: 34px; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); }
#pA .rn { min-height: 34px; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid);
    border-left: 1px solid var(--grid);
    color: var(--muted); font-size: 12px; user-select: none;
    display: flex; align-items: center; justify-content: center; padding: 0; }
#pA .hd .rn,
#pA .hd .body > * { border-top: 1px solid var(--grid); }
#pA .hd .body > div { display: flex; align-items: center; padding: 0 6px; white-space: nowrap;
    font-family: "Songti TC", "PMingLiU", "SimSun", serif; font-weight: bold; font-size: 14px; }
#pA .hd .body > div:nth-child(2),
#pA .hd .body > div:nth-child(3),
#pA .hd .body > div:nth-child(4),
#pA .hd .body > div:nth-child(5) { justify-content: center; padding: 0 2px; }
#pA #a-rows { counter-reset: rowno; }
#pA #a-rows .row { counter-increment: rowno; }
#pA #a-rows .rn::before { content: counter(rowno); }
#pA .row input { width: 100%; height: 100%; min-height: 34px; border: none; background: transparent;
    font: inherit; font-size: 14px; color: var(--ink); padding: 0 6px; border-radius: 0; outline: none; }
#pA .row input.dt { text-align: right; font-size: 1em; padding: 0 3px; }
#pA .row { -webkit-tap-highlight-color: transparent; }
#pA .row input { pointer-events: none; }
#pA .row input:focus { pointer-events: auto; }
#pA .row input:focus,
#pA .calc input:focus { background: #fff8e6; }
#pA .bad { background: #ffe3e3 !important; }
#pA .rem.low { color: var(--red); }
#pA .rem { color: var(--ink); font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 0 2px;
    cursor: pointer; user-select: none; }
#pA .ela { color: var(--ink); font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 0 2px;
    cursor: pointer; user-select: none; }
#pA .body.lift { position: relative; z-index: 3; background: #fffbe8;
    box-shadow: 0 4px 14px rgba(0,0,0,.28); }
#pA .mini-wrap { margin-top: 18px; width: fit-content; max-width: 100%; }
#pA .mrow { display: grid; grid-template-columns: 32px auto; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
/* 日期列宽按字体算：8 个数字 + 3 个汉字 + 留白，刚好放下「2026年12月28日」 */
#pA .m-body { display: grid; font-size: 10.5px;
    grid-template-columns: 86px 48px calc(8ch + 3em + 14px) 36px; }
#pA .m-body > *, #pA .m-no { min-height: 26px; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); }
#pA .m-no { border-left: 1px solid var(--grid); display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 10px; user-select: none; }
#pA .mhd .m-no, #pA .mhd .m-body > * { border-top: 1px solid var(--grid); }
#pA .mhd .m-body > div { display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: bold; padding: 0 2px; white-space: nowrap; }
#pA .mhd .m-body > div.l { justify-content: flex-start; padding-left: 5px; }
/* 序号由位置自动编号：固定不动，内容拖到哪个位置就是哪个序号 */
#pA #a-mini { counter-reset: mno; }
#pA #a-mini .mrow { counter-increment: mno; }
#pA #a-mini .m-no::before { content: counter(mno); }
/* 平时输入框不接收触摸，点一下格子才聚焦（长按时不会弹键盘） */
#pA .m-body input { width: 100%; height: 100%; min-height: 26px; border: none; background: transparent;
    font: inherit; font-size: 12px; color: var(--ink); padding: 0 5px; border-radius: 0; outline: none;
    pointer-events: none; }
#pA .m-body input:focus { background: #fff8e6; pointer-events: auto; }
#pA .m-body input.c { text-align: center; padding: 0 3px; }
#pA .m-body input.dt { text-align: right; font-size: 1em; padding: 0 3px; }
#pA .m-rem { display: flex; align-items: center; justify-content: center; font-size: 12px;
    color: var(--ink); cursor: pointer; user-select: none; }
#pA .m-rem.low { color: var(--red); }
#pA .m-body.lift { position: relative; z-index: 3; background: #fffbe8; box-shadow: 0 4px 14px rgba(0,0,0,.28); }
#pA .mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 10;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 28vh; }
#pA .mask[hidden] { display: none; }
#pA .dlg { background: #fff; width: 280px; max-width: 86%; padding: 20px 18px 16px; box-shadow: 0 4px 20px rgba(0,0,0,.25); }
#pA .dlg-t { font-size: 16px; line-height: 1.5; text-align: center; margin-bottom: 18px; word-break: break-all; }
#pA .dlg-b { display: flex; gap: 10px; justify-content: center; }
#pA .dlg-b button { font: inherit; font-size: 15px; padding: 8px 22px; border: 1px solid var(--ink);
    background: #fff; color: var(--ink); cursor: pointer; border-radius: 0; }
#pA .dlg-b .danger { background: var(--red); border-color: var(--red); color: #fff; }
#pA .dlg-b button.on { background: var(--ink); color: #fff; }
</style>
<style>
/* ===== 第 2 页：库存 ===== */
#pB .sheet { max-width: 560px; margin: 16px auto; padding: 16px 12px 24px;
    background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
#pB .today { font-size: 20px; font-weight: bold; margin: 4px 0 18px; }
/* 每行 = 固定的序号列 + 可拖动的内容部分(.body)，和第 1 页一样 */
#pB .row { display: grid; grid-template-columns: 26px minmax(0, 1fr); -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
#pB .body { display: grid; grid-template-columns: minmax(0, 1fr) 52px 50px 40px 40px 58px; }
#pB .body > *, #pB .rn { min-height: 36px; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); }
#pB .rn { border-left: 1px solid var(--grid); display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px; user-select: none; }
#pB .hd .rn, #pB .hd .body > * { border-top: 1px solid var(--grid); }
#pB .hd .body > div { display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold; white-space: nowrap; padding: 0 1px; }
#pB .hd .body > div small { font-size: 10px; font-weight: normal; margin-left: 1px; }
#pB .hd .body > div.l { justify-content: flex-start; padding-left: 8px; }
#pB .hd .body > div.sg { font-size: 18px; }
/* 序号由位置自动编号：固定不动，内容拖到哪个位置就是哪个序号 */
#pB #b-rows { counter-reset: rowno; }
#pB #b-rows .row { counter-increment: rowno; }
#pB #b-rows .rn::before { content: counter(rowno); }
/* 平时输入框不接收触摸，点一下格子才聚焦（这样长按时不会弹键盘） */
#pB .row input { pointer-events: none; }
#pB .row input:focus { pointer-events: auto; }
#pB .body.lift { position: relative; z-index: 3; background: #fffbe8; box-shadow: 0 4px 14px rgba(0,0,0,.28); }
#pB .row input { width: 100%; height: 100%; min-height: 36px; border: none; background: transparent;
    font: inherit; font-size: 15px; color: var(--ink); padding: 0 4px; border-radius: 0; outline: none;
    text-align: center; }
#pB .row input.nm { text-align: left; padding: 0 8px; }
#pB .row input:focus { background: #fff8e6; }
#pB .row input.bad { background: #ffe3e3; }
#pB .days { display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--ink); cursor: pointer; user-select: none; }
#pB .days.low { color: var(--red); }
#pB .tools { margin-top: 16px; display: flex; justify-content: flex-end; }
#pB .tools button[hidden] { display: none; }
#pB button { font: inherit; font-size: 14px; padding: 7px 14px; border: 1px solid var(--ink);
    background: #fff; color: var(--ink); cursor: pointer; border-radius: 0; }
#pB .mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 10;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 28vh; }
#pB .mask[hidden] { display: none; }
#pB .dlg { background: #fff; width: 280px; max-width: 86%; padding: 20px 18px 16px; box-shadow: 0 4px 20px rgba(0,0,0,.25); }
#pB .dlg-t { font-size: 16px; line-height: 1.5; text-align: center; margin-bottom: 18px; word-break: break-all; }
#pB .dlg-b { display: flex; gap: 10px; justify-content: center; }
#pB .dlg-b button { font-size: 15px; padding: 8px 22px; }
#pB .dlg-b .danger { background: var(--red); border-color: var(--red); color: #fff; }
</style>
</head>

<script>
/* ===== 第 1 页：倒数日 ===== */

(function () {
  var ROWS = 10, MINI_ROWS = 5, KEY = "tracker-v1";

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
  function fmt(s) {
    if (!s) return "";
    var p = s.split("-");
    return p[0] + "年" + (+p[1]) + "月" + (+p[2]) + "日";
  }
  function dayNum(s) {
    var p = s.split("-");
    return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  }
  function todayIso() {
    var n = new Date();
    return iso(n.getFullYear(), n.getMonth() + 1, n.getDate());
  }
  function addDays(s, n) {
    var p = s.split("-");
    var dt = new Date(+p[0], +p[1] - 1, +p[2] + n);
    return iso(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
  }
  function validIso(y, m, d) {
    var dt = new Date(y, m - 1, d);
    return (dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d) ? iso(y, m, d) : null;
  }

  // 解析输入：空 → ""；认不出 → null
  // 支持：20261126 / 261126 / 1126 / 926 / 26（本月26日）/ 11/26 / 2026-11-26 / 2026年11月26日
  function parseDate(raw) {
    var s = (raw || "").trim();
    if (!s) return "";
    var parts = s.match(/\d+/g);
    if (!parts) return null;
    var now = new Date(), y, m, d;
    if (parts.length >= 3) {
      y = +parts[0]; m = +parts[1]; d = +parts[2];
      if (y < 100) y += 2000;
    } else if (parts.length === 2) {
      y = now.getFullYear(); m = +parts[0]; d = +parts[1];
    } else {
      var n = parts[0];
      if (n.length === 8) { y = +n.slice(0, 4); m = +n.slice(4, 6); d = +n.slice(6, 8); }
      else if (n.length === 6) { y = 2000 + (+n.slice(0, 2)); m = +n.slice(2, 4); d = +n.slice(4, 6); }
      else if (n.length === 4) { y = now.getFullYear(); m = +n.slice(0, 2); d = +n.slice(2, 4); }
      else if (n.length === 3) { y = now.getFullYear(); m = +n.slice(0, 1); d = +n.slice(1, 3); }
      else if (n.length <= 2) { y = now.getFullYear(); m = now.getMonth() + 1; d = +n; }
      else return null;
    }
    return validIso(y, m, d);
  }

  // ===== 数据 =====
  var state = null;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || typeof state !== "object") state = {};
  var rowsData = [];
  for (var i = 0; i < ROWS; i++) {
    var o = (state.rows && state.rows[i]) || {};
    rowsData.push({ text: o.text || "", from: o.from || "", to: o.to || "", hide: !!o.hide });
  }
  var miniData = [];
  for (var j = 0; j < MINI_ROWS; j++) {
    var m = (state.mini && state.mini[j]) || {};
    miniData.push({ text: m.text || "", stock: m.stock || "", due: m.due || "" });
  }
  var calc = state.calc || { base: todayIso(), days: "30" };
  state = { rows: rowsData, calc: calc, mini: miniData };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ===== 日期输入框：点一下全选，直接用数字键盘输入，离开后自动整理成「X年X月X日」=====
  function dateInput(get, set, after) {
    var el = document.createElement("input");
    el.type = "text"; el.className = "dt"; el.autocomplete = "off";
    el.setAttribute("inputmode", "numeric");
    el.value = fmt(get());
    el.addEventListener("focus", function () {
      setTimeout(function () { try { el.select(); } catch (e) {} }, 0);
    });
    el.addEventListener("blur", function () {
      var v = parseDate(el.value);
      if (v === null) {                       // 认不出来：恢复原样并闪一下
        el.value = fmt(get());
        el.classList.add("bad");
        setTimeout(function () { el.classList.remove("bad"); }, 700);
        return;
      }
      set(v);
      el.value = fmt(v);
      save();
      after();
    });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
    });
    return el;
  }

  // ===== 今日日期 =====
  var todayEl = document.getElementById("a-today");
  var lastToday = "";
  function showToday() {
    lastToday = todayIso();
    var p = lastToday.split("-");
    var wd = ["日", "一", "二", "三", "四", "五", "六"][new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
    todayEl.textContent = "今日日期：" + fmt(lastToday) + "\u3000星期" + wd;
  }

  // ===== 日期计算：日期 + 天数 = 日期 =====
  var resEl = document.getElementById("a-calcRes");
  function updateCalc() {
    var n = parseInt(state.calc.days, 10);
    var b = state.calc.base;
    resEl.textContent = (b && !isNaN(n)) ? fmt(addDays(b, n)) : "";
  }
  document.getElementById("a-calcBaseBox").appendChild(
    dateInput(function () { return state.calc.base; }, function (v) { state.calc.base = v; }, updateCalc)
  );
  var daysEl = document.createElement("input");
  daysEl.type = "text"; daysEl.autocomplete = "off"; daysEl.setAttribute("inputmode", "numeric");
  daysEl.value = state.calc.days;
  daysEl.addEventListener("focus", function () {
    setTimeout(function () { try { daysEl.select(); } catch (e) {} }, 0);
  });
  daysEl.addEventListener("input", function () {
    var v = daysEl.value.replace(/[^\d-]/g, "").replace(/(?!^)-/g, "").slice(0, 6);
    daysEl.value = v;
    state.calc.days = v;
    save();
    updateCalc();
  });
  daysEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); daysEl.blur(); }
  });
  document.getElementById("a-calcDaysBox").appendChild(daysEl);

  // ===== 表格 =====
  function updateRem(row) {
    var t = dayNum(todayIso()), r = row._r;
    var left = r.to ? dayNum(r.to) - t : null;                          // 余天：至 − 今天
    row._rem.textContent = left === null ? "" : String(left);
    row._rem.classList.toggle("low", left !== null && left <= 5);        // 5 天及以下（含已过期的负数）显示红色，更多显示黑色
    // 历时：今天 − 自（「自」在今天之后则为负数）；这一行选了「不显示」时留空
    row._ela.textContent = (r.from && !r.hide) ? String(t - dayNum(r.from)) : "";
  }
  function updateAllRem() { [].forEach.call(box.children, updateRem); }

  // ===== 点行号或「余天」数字：确认后清空这一行 =====
  var mask = document.getElementById("a-mask");
  var pending = null;
  function askClear(row) {
    var r = row._r;
    if (!r.text && !r.from && !r.to) return;          // 本来就是空的，不弹窗
    pending = row;
    var idx = [].indexOf.call(box.children, row);
    var name = r.text ? "「" + (r.text.length > 12 ? r.text.slice(0, 12) + "…" : r.text) + "」" : "";
    document.getElementById("a-dlgT").textContent = "是否清空第 " + (idx + 1) + " 项" + name + "？";
    mask.hidden = false;
  }
  function closeAsk() { mask.hidden = true; pending = null; }
  document.getElementById("a-dlgNo").onclick = closeAsk;
  mask.onclick = function (e) { if (e.target === mask) closeAsk(); };
  document.getElementById("a-dlgYes").onclick = function () {
    var row = pending;
    if (row) {
      var r = row._r;
      r.text = ""; r.from = ""; r.to = ""; r.hide = false;
      row._in.t.value = ""; row._in.f.value = ""; row._in.o.value = "";
      updateRem(row);
      save();
    }
    closeAsk();
  };

  // ===== 点「历时」格子：选择显示 / 不显示（整行都没内容的行，点了没反应）=====
  var maskEla = document.getElementById("a-maskEla");
  var elaRow = null;
  function askEla(row) {
    var r = row._r;
    if (!r.text && !r.from && !r.to) return;
    elaRow = row;
    var idx = [].indexOf.call(box.children, row);
    document.getElementById("a-elaT").textContent = "第 " + (idx + 1) + " 项：历时一栏";
    document.getElementById("a-elaShow").classList.toggle("on", !r.hide);
    document.getElementById("a-elaHide").classList.toggle("on", !!r.hide);
    maskEla.hidden = false;
  }
  function closeEla() { maskEla.hidden = true; elaRow = null; }
  function setEla(hide) {
    if (elaRow) { elaRow._r.hide = hide; updateRem(elaRow); save(); }
    closeEla();
  }
  document.getElementById("a-elaShow").onclick = function () { setEla(false); };
  document.getElementById("a-elaHide").onclick = function () { setEla(true); };
  maskEla.onclick = function (e) { if (e.target === maskEla) closeEla(); };

  var box = document.getElementById("a-rows");
  function buildRows() {
    box.innerHTML = "";
    state.rows.forEach(function (r) {
      var row = document.createElement("div");
      row.className = "row";
      row._r = r;

      var rn = document.createElement("div");
      rn.className = "rn";

      var tw = document.createElement("div");
      var t = document.createElement("input");
      t.type = "text"; t.maxLength = 60; t.value = r.text; t.autocomplete = "off";
      t.addEventListener("input", function () { r.text = t.value; save(); });
      tw.appendChild(t);

      var fIn = dateInput(function () { return r.from; }, function (v) { r.from = v; }, function () { updateRem(row); });
      var fw = document.createElement("div");
      fw.appendChild(fIn);

      var oIn = dateInput(function () { return r.to; }, function (v) { r.to = v; }, function () { updateRem(row); });
      var ow = document.createElement("div");
      ow.appendChild(oIn);

      var ela = document.createElement("div");
      ela.className = "ela";
      row._ela = ela;
      ela.onclick = function () { askEla(row); };

      var rem = document.createElement("div");
      rem.className = "rem";
      row._rem = rem;
      row._in = { t: t, f: fIn, o: oIn };
      rem.onclick = function () { askClear(row); };

      var body = document.createElement("div");
      body.className = "body";
      body.appendChild(tw); body.appendChild(fw); body.appendChild(ow); body.appendChild(ela); body.appendChild(rem);
      row._body = body;

      row.appendChild(rn); row.appendChild(body);
      box.appendChild(row);
    });
  }
  buildRows();

  // ===== 通用：长按一行上下拖动换顺序（序号列固定不动）=====
  function enableDrag(box, rowSel, noSel, onDrop) {
    var LONG = 400, SLOP = 8;
    var press = null, drag = null, lastTouch = 0, suppressUntil = 0;

    function cancelPress() { if (press) { clearTimeout(press.timer); press = null; } }
    function startPress(row, x, y) {
      cancelPress();
      press = { row: row, x: x, y: y, timer: setTimeout(function () { beginDrag(); }, LONG) };
    }
    function beginDrag() {
      if (!press) return;
      var row = press.row;
      drag = { row: row, body: row._body, grab: press.y - row.getBoundingClientRect().top, dy: 0 };
      press = null;
      try { var ae = document.activeElement; if (ae && row.contains(ae)) ae.blur(); } catch (e) {}
      document.body.classList.add("dragging");
      row._body.classList.add("lift");
      try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
    }
    function moveDrag(y) {
      var row = drag.row, h = row.offsetHeight;
      var br = box.getBoundingClientRect();
      var desired = Math.max(br.top - 6, Math.min(y - drag.grab, br.bottom - h + 6));
      var dy = desired - row.getBoundingClientRect().top;
      for (var g = 0; g < 12; g++) {
        var next = row.nextElementSibling, prev = row.previousElementSibling;
        if (dy > h / 2 && next) box.insertBefore(row, next.nextSibling);
        else if (dy < -h / 2 && prev) box.insertBefore(row, prev);
        else break;
        dy = desired - row.getBoundingClientRect().top;
      }
      drag.dy = dy;
      drag.body.style.transform = "translateY(" + dy + "px)";
    }
    function endDrag() {
      var row = drag.row;
      row._body.style.transform = "";
      row._body.classList.remove("lift");
      document.body.classList.remove("dragging");
      drag = null;
      suppressUntil = Date.now() + 500;
      onDrop([].slice.call(box.children));
    }
    function pressable(e) {
      var row = e.target.closest ? e.target.closest(rowSel) : null;
      if (!row || e.target.closest(noSel) || e.target === document.activeElement) return null;
      return row;
    }

    box.addEventListener("touchstart", function (e) {
      lastTouch = Date.now();
      if (e.touches.length !== 1) { cancelPress(); return; }
      var row = pressable(e);
      if (row) startPress(row, e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    box.addEventListener("touchmove", function (e) {
      lastTouch = Date.now();
      var t = e.touches[0];
      if (drag) { if (e.cancelable) e.preventDefault(); moveDrag(t.clientY); return; }
      if (press && (Math.abs(t.clientX - press.x) > SLOP || Math.abs(t.clientY - press.y) > SLOP)) cancelPress();
    }, { passive: false });
    function endTouch(e) {
      lastTouch = Date.now();
      if (drag) { if (e.cancelable) e.preventDefault(); endDrag(); }
      cancelPress();
    }
    box.addEventListener("touchend", endTouch);
    box.addEventListener("touchcancel", endTouch);
    box.addEventListener("contextmenu", function (e) { if (drag || press) e.preventDefault(); });

    box.addEventListener("mousedown", function (e) {
      if (Date.now() - lastTouch < 800 || e.button !== 0) return;
      var row = pressable(e);
      if (row) startPress(row, e.clientX, e.clientY);
    });
    document.addEventListener("mousemove", function (e) {
      if (Date.now() - lastTouch < 800) return;
      if (drag) { e.preventDefault(); moveDrag(e.clientY); return; }
      if (press && (Math.abs(e.clientX - press.x) > SLOP || Math.abs(e.clientY - press.y) > SLOP)) cancelPress();
    });
    document.addEventListener("mouseup", function () {
      if (Date.now() - lastTouch < 800) return;
      if (drag) endDrag();
      cancelPress();
    });
    // 拖动刚结束时，吞掉紧跟着的那一下点击
    box.addEventListener("click", function (e) {
      if (Date.now() < suppressUntil) { e.stopPropagation(); e.preventDefault(); }
    }, true);
  }

  // ===== 底下小表格：序号 / 事项 / 库存 / 限期 / 余天 =====
  var miniBox = document.getElementById("a-mini");

  function updateMini(row) {
    var m = row._m;
    var left = m.due ? dayNum(m.due) - dayNum(todayIso()) : null;       // 余天：限期 − 今天
    row._rem.textContent = left === null ? "" : String(left);
    row._rem.classList.toggle("low", left !== null && left <= 5);        // 5 天及以下（含已过期）红色，其余黑色
  }
  function updateMiniAll() { [].forEach.call(miniBox.children, updateMini); }

  // 点「余天」：确认后清空这一项
  var maskM = document.getElementById("a-maskM");
  var pendingM = null;
  function askMini(row) {
    var m = row._m;
    if (!m.text && !m.stock && !m.due) return;           // 整行都没内容，点了没反应
    pendingM = row;
    var nm = m.text ? "「" + (m.text.length > 12 ? m.text.slice(0, 12) + "…" : m.text) + "」" : "";
    document.getElementById("a-dlgTM").textContent =
      "是否清空第 " + ([].indexOf.call(miniBox.children, row) + 1) + " 项" + nm + "？";
    maskM.hidden = false;
  }
  function closeMini() { maskM.hidden = true; pendingM = null; }
  document.getElementById("a-dlgNoM").onclick = closeMini;
  maskM.onclick = function (e) { if (e.target === maskM) closeMini(); };
  document.getElementById("a-dlgYesM").onclick = function () {
    var row = pendingM;
    if (row) {
      var m = row._m;
      m.text = ""; m.stock = ""; m.due = "";
      row._in.t.value = ""; row._in.s.value = ""; row._in.d.value = "";
      updateMini(row);
      save();
    }
    closeMini();
  };

  function wrapCell(el) { var d = document.createElement("div"); d.appendChild(el); return d; }   // 边框画在外层格子上

  state.mini.forEach(function (m) {
    var row = document.createElement("div");
    row.className = "mrow";
    row._m = m;

    var no = document.createElement("div");
    no.className = "m-no";

    var ti = document.createElement("input");
    ti.type = "text"; ti.maxLength = 30; ti.autocomplete = "off"; ti.value = m.text;
    ti.addEventListener("input", function () { m.text = ti.value; save(); });
    ti.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); ti.blur(); } });

    var si = document.createElement("input");
    si.type = "text"; si.className = "c"; si.maxLength = 20; si.autocomplete = "off"; si.value = m.stock;
    si.addEventListener("input", function () { m.stock = si.value; save(); });
    si.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); si.blur(); } });

    var di = dateInput(function () { return m.due; }, function (v) { m.due = v; }, function () { updateMini(row); });

    var rem = document.createElement("div");
    rem.className = "m-rem";
    rem.onclick = function () { askMini(row); };

    var body = document.createElement("div");
    body.className = "m-body";
    body.appendChild(wrapCell(ti)); body.appendChild(wrapCell(si)); body.appendChild(wrapCell(di)); body.appendChild(rem);

    row._body = body; row._rem = rem; row._in = { t: ti, s: si, d: di };
    row.appendChild(no); row.appendChild(body);
    miniBox.appendChild(row);
    updateMini(row);
  });

  // 点一下单元格 → 聚焦里面的输入框（这时才弹出键盘）
  miniBox.addEventListener("click", function (e) {
    var cell = e.target;
    if (!cell || cell.tagName === "INPUT" || !cell.querySelector) return;
    if (!cell.parentNode || !cell.parentNode.classList.contains("m-body")) return;
    var inp = cell.querySelector("input");
    if (inp) inp.focus();
  });

  // 长按任意一行（序号除外）上下拖动换顺序
  enableDrag(miniBox, ".mrow", ".m-no", function (els) {
    var order = els.map(function (el) { return el._m; });
    if (order.some(function (m, i) { return m !== state.mini[i]; })) { state.mini = order; save(); }
  });

  // ===== 长按任意一行，上下拖动换顺序 =====
  var LONG = 400, SLOP = 8;
  var press = null;          // 按下但还没满 0.4 秒
  var drag = null;           // 正在拖动
  var lastTouch = 0;         // 用来忽略触摸后补发的鼠标事件
  var suppressUntil = 0;     // 拖动结束后短时间内不触发点击

  function cancelPress() {
    if (press) { clearTimeout(press.timer); press = null; }
  }
  function startPress(row, x, y) {
    cancelPress();
    press = {
      row: row, x: x, y: y,
      timer: setTimeout(function () { beginDrag(); }, LONG)
    };
  }
  function beginDrag() {
    if (!press) return;
    var row = press.row;
    var top = row.getBoundingClientRect().top;
    drag = { row: row, body: row._body, grab: press.y - top, dy: 0 };
    press = null;
    // 只有正在编辑的输入框就在被拖的这一行里时才收起键盘；否则键盘/光标保持原样
    try { var ae = document.activeElement; if (ae && row.contains(ae)) ae.blur(); } catch (e) {}
    document.body.classList.add("dragging");
    row._body.classList.add("lift");
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
  }
  // 只移动内容部分(.body)；序号列留在原位，序号按位置自动编号
  function moveDrag(y) {
    var row = drag.row;
    var h = row.offsetHeight;
    var br = box.getBoundingClientRect();
    var desired = Math.max(br.top - 6, Math.min(y - drag.grab, br.bottom - h + 6));
    var dy = desired - row.getBoundingClientRect().top;
    for (var g = 0; g < 12; g++) {
      var next = row.nextElementSibling, prev = row.previousElementSibling;
      if (dy > h / 2 && next) box.insertBefore(row, next.nextSibling);
      else if (dy < -h / 2 && prev) box.insertBefore(row, prev);
      else break;
      dy = desired - row.getBoundingClientRect().top;
    }
    drag.dy = dy;
    drag.body.style.transform = "translateY(" + dy + "px)";
  }
  function endDrag() {
    var row = drag.row;
    row._body.style.transform = "";
    row._body.classList.remove("lift");
    document.body.classList.remove("dragging");
    drag = null;
    suppressUntil = Date.now() + 500;
    var order = [].map.call(box.children, function (el) { return el._r; });
    var changed = order.some(function (r, i) { return r !== state.rows[i]; });
    if (changed) { state.rows = order; save(); }       // 页面上已经是新顺序，不用重建，键盘/光标不受影响
  }

  // 触摸（手机）
  box.addEventListener("touchstart", function (e) {
    lastTouch = Date.now();
    if (e.touches.length !== 1) { cancelPress(); return; }
    var row = e.target.closest ? e.target.closest(".row") : null;
    if (!row || (e.target.closest && e.target.closest(".rn")) || e.target === document.activeElement) return;   // 序号列、正在编辑的输入框不参与拖动

    if (press && (Math.abs(t.clientX - press.x) > SLOP || Math.abs(t.clientY - press.y) > SLOP)) cancelPress();
  }, { passive: false });
  function endTouch(e) {
    lastTouch = Date.now();
    if (drag) {
      if (e.cancelable) e.preventDefault();      // 不要再触发点击/弹出键盘
      endDrag();
    }
    cancelPress();
  }
  box.addEventListener("touchend", endTouch);
  box.addEventListener("touchcancel", endTouch);
  box.addEventListener("contextmenu", function (e) {
    if (drag || press) e.preventDefault();
  });

  // 鼠标（电脑）
  box.addEventListener("mousedown", function (e) {
    if (Date.now() - lastTouch < 800 || e.button !== 0) return;
    var row = e.target.closest ? e.target.closest(".row") : null;
    if (!row || (e.target.closest && e.target.closest(".rn")) || e.target === document.activeElement) return;
    startPress(row, e.clientX, e.clientY);
  });
  document.addEventListener("mousemove", function (e) {
    if (Date.now() - lastTouch < 800) return;
    if (drag) { e.preventDefault(); moveDrag(e.clientY); return; }
    if (press && (Math.abs(e.clientX - press.x) > SLOP || Math.abs(e.clientY - press.y) > SLOP)) cancelPress();
  });
  document.addEventListener("mouseup", function () {
    if (Date.now() - lastTouch < 800) return;
    if (drag) endDrag();
    cancelPress();
  });

  // 拖动刚结束时，吞掉紧跟着的那一下点击
  box.addEventListener("click", function (e) {
    if (Date.now() < suppressUntil) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  // 点一下单元格 → 聚焦里面的输入框（这时才弹出键盘）
  box.addEventListener("click", function (e) {
    var cell = e.target;
    if (!cell || cell.tagName === "INPUT" || !cell.querySelector) return;
    if (!cell.parentNode || !cell.parentNode.classList.contains("body")) return;
    var inp = cell.querySelector("input");
    if (inp) inp.focus();
  });

  showToday();
  updateCalc();
  updateAllRem();
  updateMiniAll();

  // 跨天后自动刷新今日日期和剩余天数
  function checkDay() {
    if (todayIso() !== lastToday) { showToday(); updateAllRem(); updateMiniAll(); }
  }
  setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkDay(); });
})();

<script>
/* ===== 第 2 页：库存 ===== */

(function () {
  var ROWS = 10, KEY = "stock-v1";
  var LOW = 5;   // 可供天数 ≤ 5 显示红色，高于 5 显示黑色

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function num(s) { var n = parseFloat(s); return isNaN(n) ? null : n; }
  function r2(n) { return Math.round(n * 100) / 100; }

  // ===== 今日日期 =====
  var todayEl = document.getElementById("b-today");
  var lastDay = "";
  function showToday() {
    var n = new Date();
    lastDay = n.getFullYear() + "-" + n.getMonth() + "-" + n.getDate();
    var wd = ["日", "一", "二", "三", "四", "五", "六"][n.getDay()];
    todayEl.textContent = "今日日期：" + n.getFullYear() + "年" + (n.getMonth() + 1) + "月" + n.getDate() + "日　星期" + wd;
  }
  showToday();
  document.addEventListener("visibilitychange", function () {
    var n = new Date();
    if (!document.hidden && lastDay !== n.getFullYear() + "-" + n.getMonth() + "-" + n.getDate()) showToday();
  });
  setInterval(function () {
    var n = new Date();
    if (lastDay !== n.getFullYear() + "-" + n.getMonth() + "-" + n.getDate()) showToday();
  }, 30000);

  // ===== 数据 =====
  var state = null;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || typeof state !== "object") state = {};
  var rows = [];
  for (var i = 0; i < ROWS; i++) {
    var o = (state.rows && state.rows[i]) || {};
    rows.push({ name: o.name || "", stock: o.stock || "", use: o.use || "" });
  }
  state = { rows: rows, undo: state.undo || null };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ===== 可供天数 = 库存 ÷ 日用量（向下取整成整天）=====
  function refresh(el, r) {
    var s = num(r.stock), u = num(r.use);
    if (s === null || u === null || u <= 0) { el.textContent = ""; el.classList.remove("low"); return; }
    var d = Math.floor(s / u + 1e-9);
    el.textContent = String(d);
    el.classList.toggle("low", d <= LOW);
  }

  var box = document.getElementById("b-rows");
  function idxOf(row) { return [].indexOf.call(box.children, row); }

  // ===== 撤销上一次 +/- =====
  var undoBtn = document.getElementById("b-undo");
  function showUndo() {
    var u = state.undo;
    if (!u) { undoBtn.hidden = true; return; }
    undoBtn.textContent = "撤销上次增减（第 " + (u.i + 1) + " 项 " + u.delta + "）";
    undoBtn.hidden = false;
  }
  undoBtn.onclick = function () {
    var u = state.undo;
    if (!u) return;
    var row = box.children[u.i], r = state.rows[u.i];
    r.stock = u.prev;
    row._c.stock.value = r.stock;
    refresh(row._c.days, r);
    state.undo = null;
    save();
    showUndo();
  };

  // ===== 点「可供天数」格子：确认后清空这一项 =====
  var mask = document.getElementById("b-mask");
  var pending = null;
  function askClear(row) {
    var r = row._r;
    if (!r.name && !r.stock && !r.use) return;          // 整行都没内容，点了没反应
    pending = row;
    var nm = r.name ? "「" + (r.name.length > 12 ? r.name.slice(0, 12) + "…" : r.name) + "」" : "";
    document.getElementById("b-dlgT").textContent = "是否清空第 " + (idxOf(row) + 1) + " 项" + nm + "？";
    mask.hidden = false;
  }
  function closeAsk() { mask.hidden = true; pending = null; }
  document.getElementById("b-dlgNo").onclick = closeAsk;
  mask.onclick = function (e) { if (e.target === mask) closeAsk(); };
  document.getElementById("b-dlgYes").onclick = function () {
    var row = pending;
    if (row) {
      var r = row._r, c = row._c, i = idxOf(row);
      r.name = ""; r.stock = ""; r.use = "";
      c.name.value = ""; c.stock.value = ""; c.use.value = ""; c.plus.value = ""; c.minus.value = "";
      refresh(c.days, r);
      if (state.undo && state.undo.i === i) { state.undo = null; showUndo(); }
      save();
    }
    closeAsk();
  };

  // ===== 表格 =====
  function numInput(cls, mode) {
    var el = document.createElement("input");
    el.type = "text"; el.autocomplete = "off"; el.className = cls || "";
    el.setAttribute("inputmode", mode || "decimal");
    el.addEventListener("focus", function () {
      setTimeout(function () { try { el.select(); } catch (e) {} }, 0);
    });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
    });
    return el;
  }

  state.rows.forEach(function (r) {
    var row = document.createElement("div");
    row.className = "row";
    row._r = r;

    var rn = document.createElement("div");
    rn.className = "rn";

    var nm = document.createElement("input");
    nm.type = "text"; nm.className = "nm"; nm.maxLength = 30; nm.autocomplete = "off"; nm.value = r.name;
    nm.addEventListener("input", function () { r.name = nm.value; save(); });
    nm.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); nm.blur(); } });

    var days = document.createElement("div");
    days.className = "days";
    days.onclick = function () { askClear(row); };

    var st = numInput("", "decimal");
    st.value = r.stock;
    st.addEventListener("input", function () {
      st.value = st.value.replace(/[^\d.]/g, "");
      r.stock = st.value; save(); refresh(days, r);
    });

    var us = numInput("", "decimal");
    us.value = r.use;
    us.addEventListener("input", function () {
      us.value = us.value.replace(/[^\d.]/g, "");
      r.use = us.value; save(); refresh(days, r);
    });

    // 「+」格输入数字 → 库存加上这个数；「-」格输入数字 → 库存减去这个数。
    // 输完点键盘确定或点别处就生效，这一格自动清空，库存立刻更新（不需要输入正负号）
    function adjuster(sign) {
      var el = numInput("", "decimal");
      el.addEventListener("input", function () { el.value = el.value.replace(/[^\d.]/g, ""); });
      el.addEventListener("blur", function () {
        var raw = el.value.trim();
        if (raw === "") return;
        if (!/^\d+(\.\d+)?$/.test(raw)) {
          el.classList.add("bad");
          setTimeout(function () { el.classList.remove("bad"); el.value = ""; }, 600);
          return;
        }
        var delta = sign * parseFloat(raw);
        var prevStr = r.stock;
        var next = Math.max(0, r2((num(r.stock) || 0) + delta));   // 库存最少减到 0
        r.stock = String(next);
        st.value = r.stock;
        el.value = "";
        state.undo = { i: idxOf(row), prev: prevStr, delta: (sign < 0 ? "−" : "+") + Math.abs(parseFloat(raw)) };
        save();
        refresh(days, r);
        showUndo();
      });
      return el;
    }
    var plus = adjuster(1), minus = adjuster(-1);

    function wrap(el) { var d = document.createElement("div"); d.appendChild(el); return d; }   // 边框画在外层格子上
    var body = document.createElement("div");
    body.className = "body";
    body.appendChild(wrap(nm)); body.appendChild(wrap(st)); body.appendChild(wrap(us));
    body.appendChild(wrap(plus)); body.appendChild(wrap(minus)); body.appendChild(days);
    row._body = body;
    row._c = { name: nm, stock: st, use: us, plus: plus, minus: minus, days: days };

    row.appendChild(rn); row.appendChild(body);
    box.appendChild(row);
    refresh(days, r);
  });

  // ===== 长按任意一行（序号除外），上下拖动换顺序 =====
  var LONG = 400, SLOP = 8;
  var press = null;          // 按下但还没满 0.4 秒
  var drag = null;           // 正在拖动
  var lastTouch = 0;         // 用来忽略触摸后补发的鼠标事件
  var suppressUntil = 0;     // 拖动结束后短时间内不触发点击

  function cancelPress() {
    if (press) { clearTimeout(press.timer); press = null; }
  }
  function startPress(row, x, y) {
    cancelPress();
    press = { row: row, x: x, y: y, timer: setTimeout(function () { beginDrag(); }, LONG) };
  }
  function beginDrag() {
    if (!press) return;
    var row = press.row;
    var top = row.getBoundingClientRect().top;
    drag = { row: row, body: row._body, grab: press.y - top, dy: 0 };
    press = null;
    try { var ae = document.activeElement; if (ae && row.contains(ae)) ae.blur(); } catch (e) {}
    document.body.classList.add("dragging");
    row._body.classList.add("lift");
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
  }
  // 只移动内容部分(.body)；序号列留在原位，序号按位置自动编号
  function moveDrag(y) {
    var row = drag.row;
    var h = row.offsetHeight;
    var br = box.getBoundingClientRect();
    var desired = Math.max(br.top - 6, Math.min(y - drag.grab, br.bottom - h + 6));
    var dy = desired - row.getBoundingClientRect().top;
    for (var g = 0; g < 12; g++) {
      var next = row.nextElementSibling, prev = row.previousElementSibling;
      if (dy > h / 2 && next) box.insertBefore(row, next.nextSibling);
      else if (dy < -h / 2 && prev) box.insertBefore(row, prev);
      else break;
      dy = desired - row.getBoundingClientRect().top;
    }
    drag.dy = dy;
    drag.body.style.transform = "translateY(" + dy + "px)";
  }
  function endDrag() {
    var row = drag.row;
    row._body.style.transform = "";
    row._body.classList.remove("lift");
    document.body.classList.remove("dragging");
    drag = null;
    suppressUntil = Date.now() + 500;
    var order = [].map.call(box.children, function (el) { return el._r; });
    var changed = order.some(function (r, i) { return r !== state.rows[i]; });
    if (changed) {
      state.rows = order;
      state.undo = null;      // 顺序变了，「撤销上次增减」里记的第几项就对不上了，所以一起收掉
      showUndo();
      save();
    }
  }

  // 触摸（手机）
  box.addEventListener("touchstart", function (e) {
    lastTouch = Date.now();
    if (e.touches.length !== 1) { cancelPress(); return; }
    var row = e.target.closest ? e.target.closest(".row") : null;
    if (!row || (e.target.closest && e.target.closest(".rn")) || e.target === document.activeElement) return;
    var t = e.touches[0];
    startPress(row, t.clientX, t.clientY);
  }, { passive: true });
  box.addEventListener("touchmove", function (e) {
    lastTouch = Date.now();
    var t = e.touches[0];
    if (drag) { if (e.cancelable) e.preventDefault(); moveDrag(t.clientY); return; }
    if (press && (Math.abs(t.clientX - press.x) > SLOP || Math.abs(t.clientY - press.y) > SLOP)) cancelPress();
  }, { passive: false });
  function endTouch(e) {
    lastTouch = Date.now();
    if (drag) {
      if (e.cancelable) e.preventDefault();      // 不要再触发点击/弹出键盘
      endDrag();
    }
    cancelPress();
  }
  box.addEventListener("touchend", endTouch);
  box.addEventListener("touchcancel", endTouch);
  box.addEventListener("contextmenu", function (e) {
    if (drag || press) e.preventDefault();
  });

  // 鼠标（电脑）
  box.addEventListener("mousedown", function (e) {
    if (Date.now() - lastTouch < 800 || e.button !== 0) return;
    var row = e.target.closest ? e.target.closest(".row") : null;
    if (!row || (e.target.closest && e.target.closest(".rn")) || e.target === document.activeElement) return;
    startPress(row, e.clientX, e.clientY);
  });
  document.addEventListener("mousemove", function (e) {
    if (Date.now() - lastTouch < 800) return;
    if (drag) { e.preventDefault(); moveDrag(e.clientY); return; }
    if (press && (Math.abs(e.clientX - press.x) > SLOP || Math.abs(e.clientY - press.y) > SLOP)) cancelPress();
  });
  document.addEventListener("mouseup", function () {
    if (Date.now() - lastTouch < 800) return;
    if (drag) endDrag();
    cancelPress();
  });

  // 拖动刚结束时，吞掉紧跟着的那一下点击
  box.addEventListener("click", function (e) {
    if (Date.now() < suppressUntil) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  // 点一下单元格 → 聚焦里面的输入框（这时才弹出键盘）
  box.addEventListener("click", function (e) {
    var cell = e.target;
    if (!cell || cell.tagName === "INPUT" || !cell.querySelector) return;
    if (!cell.parentNode || !cell.parentNode.classList.contains("body")) return;
    var inp = cell.querySelector("input");
    if (inp) inp.focus();
  });

  showUndo();
})();

<script>
/* ===== 翻页 ===== */
(function () {
  var pager = document.getElementById("pager");
  var txt = document.getElementById("pgtxt");
  var prev = document.getElementById("pgPrev");
  var next = document.getElementById("pgNext");
  var bar = document.getElementById("pgbar");
  var TOTAL = 2, cur = 0, raf = 0;

  function sync() {
    raf = 0;
    var w = pager.clientWidth || 1;
    cur = Math.max(0, Math.min(TOTAL - 1, Math.round(pager.scrollLeft / w)));
    txt.textContent = "第 " + (cur + 1) + " 页，共 " + TOTAL + " 页";
    prev.disabled = cur === 0;
    next.disabled = cur === TOTAL - 1;
  }
  pager.addEventListener("scroll", function () { if (!raf) raf = requestAnimationFrame(sync); }, { passive: true });
  window.addEventListener("resize", function () { pager.scrollLeft = cur * pager.clientWidth; sync(); });
  function go(i) { pager.scrollTo({ left: i * pager.clientWidth, behavior: "smooth" }); }
  prev.onclick = function () { go(cur - 1); };
  next.onclick = function () { go(cur + 1); };
  sync();

  // 键盘弹出（正在输入）时先把页码条收起来，免得挡住输入框
  var t;
  document.addEventListener("focusin", function (e) {
    if (e.target && e.target.tagName === "INPUT") { clearTimeout(t); bar.classList.add("hide"); }
  });
  document.addEventListener("focusout", function () {
    clearTimeout(t); t = setTimeout(function () { bar.classList.remove("hide"); }, 150);
  });
})();
</script>
